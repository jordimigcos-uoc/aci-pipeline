# =============================================================================
# publish_reports.yml — Pipeline ACI complet + lloc estàtic Jinja2/D3 → Pages
#
# Genera per a cada URL analitzada:
#   - 3 informes HTML per perfil (wcag_strict / readability_first / visual_first)
#   - 1 informe comparatiu HTML amb Chart.js
#   - 1 índex global HTML amb 10 gràfics D3 (filtres, taula, metodologia)
#   - docs/results/<slug>/results.json
#   - docs/figures/<prefix>_<chartname>.jpg   (exportació Playwright)
#
# Trigger:
#   - workflow_dispatch: execució manual
#   - push a main amb canvis a urls.sample.txt, src/, configs/, templates/,
#     site_generation/, static/ o scripts/
#
# Secrets necessaris:
#   - ANTHROPIC_API_KEY: clau API d'Anthropic (opcional; M5-IA s'omet si falta)
#     → Settings → Secrets and variables → Actions → New repository secret
# =============================================================================
name: Publica informes ACI a GitHub Pages

on:
  workflow_dispatch:
    inputs:
      url_file:
        description: "Fitxer d'URLs a analitzar"
        required: false
        default: "data/inputs/urls.sample.txt"
      profile:
        description: "Perfil de puntuació (si all_profiles=false)"
        required: false
        default: "wcag_strict"
        type: choice
        options:
          - wcag_strict
          - readability_first
          - visual_first
      all_profiles:
        description: "Executa els 3 perfils (ignora 'profile')"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      export_charts:
        description: "Exporta gràfics D3 com a JPG"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

  push:
    branches: [main]
    paths:
      - "data/inputs/urls.sample.txt"
      - "src/**"
      - "configs/**"
      - "templates/**"
      - "site_generation/**"
      - "static/**"
      - "scripts/render_reports.py"
      - "scripts/export_charts.py"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run-pipeline-and-publish:
    name: Pipeline ACI + lloc estàtic + GitHub Pages
    runs-on: ubuntu-22.04   # ubuntu-latest=24.04 trenca libasound2 amb Playwright 1.44

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Python 3.11 ──────────────────────────────────────────────────────
      - name: Configura Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # ── 3. Dependències Python ───────────────────────────────────────────────
      - name: Instal·la dependències Python
        run: |
          pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          echo "PYTHONPATH=$GITHUB_WORKSPACE/src" >> $GITHUB_ENV

      # ── 4. Playwright + Chromium ─────────────────────────────────────────────
      - name: Instal·la Chromium (Playwright)
        run: playwright install chromium --with-deps

      # ── 5. Executa el pipeline ACI ───────────────────────────────────────────
      - name: Executa pipeline ACI
        run: |
          URL_FILE="${{ github.event.inputs.url_file || 'data/inputs/urls.sample.txt' }}"
          PROFILE="${{ github.event.inputs.profile || 'wcag_strict' }}"
          ALL="${{ github.event.inputs.all_profiles || 'true' }}"

          if [ "$ALL" = "true" ]; then
            EXTRA="--all-profiles"
          else
            EXTRA="--profile $PROFILE"
          fi

          python -m aci_pipeline.cli \
            --url-file "$URL_FILE" \
            $EXTRA \
            --output results/gh-pages/ \
            --log-level INFO
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || '' }}

      # ── 6. Genera lloc estàtic (Jinja2 + D3) ────────────────────────────────
      - name: Genera lloc estàtic (site_generation/render_reports.py)
        run: |
          python site_generation/render_reports.py \
            --results-dir results/gh-pages \
            --output-dir  docs \
            --templates-dir templates \
            --log-level INFO

          # Còpia de logs (útil per a diagnosi des de Pages)
          mkdir -p docs/logs
          cp logs/*.log docs/logs/ 2>/dev/null || true

          echo ""
          echo "── Contingut de docs/ ──────────────────────────────"
          ls -lh docs/
          echo ""
          echo "── Informes HTML (reports/) ────────────────────────"
          ls docs/reports/ 2>/dev/null | head -40 || echo "  (cap informe)"
          echo ""
          echo "── Fitxers de resultats per slug ───────────────────"
          find docs/results -name "results.json" 2>/dev/null | head -20 || echo "  (cap slug)"

      # ── 7. Exporta gràfics D3 com a JPG ─────────────────────────────────────
      - name: Exporta gràfics D3 (scripts/export_charts.py)
        if: ${{ github.event.inputs.export_charts != 'false' }}
        run: |
          if [ -f docs/index.html ]; then
            python scripts/export_charts.py \
              --input   docs/index.html \
              --output  docs/figures \
              --prefix  global \
              --width   1440 \
              --quality 90 \
              --format  jpg \
              --log-level INFO
          else
            echo "docs/index.html no trobat; s'omet l'exportació de gràfics"
          fi
        continue-on-error: true   # no bloqueja el workflow si l'export falla

      # ── 8. Verifica que l'índex s'ha generat ────────────────────────────────
      - name: Verifica index.html
        run: |
          if [ ! -f docs/index.html ]; then
            echo "ERROR: docs/index.html no s'ha generat" >&2
            exit 1
          fi
          echo "✓ docs/index.html generat correctament"
          wc -l docs/index.html
          echo ""
          echo "── Resum fitxers generats ──────────────────────────"
          echo "  Informes HTML:   $(ls docs/reports/*.html 2>/dev/null | wc -l)"
          echo "  Slugs JSON:      $(find docs/results -name 'results.json' 2>/dev/null | wc -l)"
          echo "  Figures JPG/PNG: $(ls docs/figures/*.jpg docs/figures/*.png 2>/dev/null | wc -l)"

      # ── 9. Tests (opcional, no bloqueja) ────────────────────────────────────
      - name: Executa tests pytest
        run: |
          pytest tests/test_render.py -v --tb=short 2>&1 || \
            echo "⚠ Alguns tests han fallat (reviseu el log)"
        continue-on-error: true

      # ── 10. Publica a la branca gh-pages ────────────────────────────────────
      - name: Publica a GitHub Pages (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token:   ${{ secrets.GITHUB_TOKEN }}
          publish_dir:    ./docs
          publish_branch: gh-pages
          commit_message: "ci: publica informes ACI · run ${{ github.run_id }}"
          keep_files:     false

      # ── 11. Informa de la URL pública ────────────────────────────────────────
      - name: URL de GitHub Pages
        run: |
          echo ""
          echo "╔══════════════════════════════════════════════════════════╗"
          echo "║  Informes ACI publicats a GitHub Pages!                 ║"
          echo "╚══════════════════════════════════════════════════════════╝"
          REPO="${{ github.repository }}"
          OWNER=$(echo "$REPO" | cut -d/ -f1)
          NAME=$(echo "$REPO"  | cut -d/ -f2)
          echo "  Tauler:     https://${OWNER}.github.io/${NAME}/"
          echo "  Informes:   https://${OWNER}.github.io/${NAME}/reports/"
          echo "  Figures:    https://${OWNER}.github.io/${NAME}/figures/"
          echo "  Metodologia:https://${OWNER}.github.io/${NAME}/metrics.html"
          echo ""
