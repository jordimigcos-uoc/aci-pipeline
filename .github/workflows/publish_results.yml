# =============================================================================
# publish_results.yml — Publica resultats del pipeline ACI a GitHub Pages
#
# Per què GitHub Pages no executa Python:
#   GitHub Pages és un servei d'hosting estàtic (HTML/CSS/JS).
#   Per tant, executem el pipeline ACI dins d'una GitHub Action, exportem
#   els resultats (HTML, JSON, CSV) a la carpeta docs/, i Pages serveix
#   aquest contingut estàtic des de la branca gh-pages.
#
# Trigger:
#   - workflow_dispatch: execució manual des de la pestanya "Actions" de GitHub
#   - push a main amb canvis a urls.sample.txt, src/ o configs/ (auto-publicació)
#
# Secrets necessaris:
#   - ANTHROPIC_API_KEY: clau API d'Anthropic (opcional; M5-IA s'omet si falta)
#     → Configura-la a: Settings → Secrets → Actions → New repository secret
# =============================================================================
name: Publica resultats a GitHub Pages

on:
  # Execució manual des de la interfície web de GitHub
  workflow_dispatch:
    inputs:
      url_file:
        description: "Fitxer d'URLs a analitzar"
        required: false
        default: "data/inputs/urls.sample.txt"
      profile:
        description: "Perfil de puntuació"
        required: false
        default: "wcag_strict"
        type: choice
        options:
          - wcag_strict
          - readability_first
          - visual_first
      all_profiles:
        description: "Executa els 3 perfils (ignora 'profile')"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

  # Auto-publicació quan canvien fitxers clau
  push:
    branches: [main]
    paths:
      - "data/inputs/urls.sample.txt"
      - "src/**"
      - "configs/**"

# Permisos per a Pages i per escriure a la branca gh-pages
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run-pipeline-and-publish:
    name: Executa pipeline i publica a Pages
    runs-on: ubuntu-22.04   # ubuntu-latest = 24.04 trenca libasound2 amb Playwright 1.44

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Python ───────────────────────────────────────────────────────────
      - name: Configura Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # ── 3. Dependències ─────────────────────────────────────────────────────
      - name: Instal·la dependències
        run: |
          pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          echo "PYTHONPATH=$GITHUB_WORKSPACE/src" >> $GITHUB_ENV

      # ── 4. Playwright ───────────────────────────────────────────────────────
      - name: Instal·la Chromium (Playwright)
        run: playwright install chromium --with-deps

      # ── 5. Executa el pipeline ───────────────────────────────────────────────
      - name: Executa pipeline ACI
        run: |
          URL_FILE="${{ github.event.inputs.url_file || 'data/inputs/urls.sample.txt' }}"
          PROFILE="${{ github.event.inputs.profile || 'wcag_strict' }}"
          ALL="${{ github.event.inputs.all_profiles || 'false' }}"

          EXTRA_FLAGS=""
          if [ "$ALL" = "true" ]; then
            EXTRA_FLAGS="--all-profiles"
          else
            EXTRA_FLAGS="--profile $PROFILE"
          fi

          python -m aci_pipeline.cli \
            --url-file "$URL_FILE" \
            $EXTRA_FLAGS \
            --output results/gh-pages/ \
            --log-level INFO
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || '' }}

      # ── 6. Genera el lloc estàtic amb build_site.py ─────────────────────────
      - name: Genera lloc estàtic (build_site.py)
        run: |
          python scripts/build_site.py \
            --results results/gh-pages \
            --output  docs

          # Còpia de logs (opcional, útil per a diagnosi)
          mkdir -p docs/logs
          cp logs/*.log docs/logs/ 2>/dev/null || true

          echo "Contingut de docs/:"
          ls -la docs/
          echo "Informes HTML generats:"
          ls docs/reports/ 2>/dev/null | head -20 || echo "  (cap)"

      # ── 7. Publica a la branca gh-pages amb peaceiris/actions-gh-pages ───────
      # Necessita: Settings → Pages → Source: gh-pages branch / root
      - name: Publica a GitHub Pages (branca gh-pages)
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token:    ${{ secrets.GITHUB_TOKEN }}   # Token automàtic de GitHub
          publish_dir:     ./docs                         # Carpeta que es publica
          publish_branch:  gh-pages                       # Branca de Pages
          commit_message:  "ci: publica resultats ACI · run ${{ github.run_id }}"
          keep_files:      false                          # Substitueix el contingut anterior

      # ── 8. Informa de la URL de Pages ───────────────────────────────────────
      - name: URL de GitHub Pages
        run: |
          echo ""
          echo "╔══════════════════════════════════════════════════════════╗"
          echo "║  Resultats publicats a GitHub Pages!                    ║"
          echo "╚══════════════════════════════════════════════════════════╝"
          REPO="${{ github.repository }}"
          OWNER=$(echo $REPO | cut -d/ -f1)
          REPONAME=$(echo $REPO | cut -d/ -f2)
          echo "  URL: https://${OWNER}.github.io/${REPONAME}/"
          echo ""
